    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />

    <meta name="theme-color" content="#2E6F5C" />
    <!-- "Instalable" en iOS/iPadOS: Safari no atiende al manifest, así que
         necesita estos meta tags propios para comportarse como app instalada
         (barra de estado a juego, sin barra de Safari, icono correcto). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chefryer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!--
      Truco estándar de "SPA en GitHub Pages" (spa-github-pages): GitHub Pages
      no soporta rewrites de servidor, así que una recarga en /recetas/abc123
      devolvería un 404 real. public/404.html captura esa ruta y la reenvía
      aquí codificada en la query string; este script la reconstruye con
      history.replaceState ANTES de que React Router monte, así que para el
      usuario es invisible.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
