    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!--
      Truco estándar de "SPA en GitHub Pages" (spa-github-pages): GitHub Pages
      no soporta rewrites de servidor, así que una recarga en /recetas/abc123
      devolvería un 404 real. public/404.html captura esa ruta y la reenvía
      aquí codificada en la query string; este script la reconstruye con
      history.replaceState ANTES de que React Router monte, así que para el
      usuario es invisible.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
