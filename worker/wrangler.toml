name = "airfryer-chef-ai-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Secretos (NUNCA van aquí en texto plano — se configuran con `wrangler secret put`
# o en el dashboard de Cloudflare, Settings → Variables and Secrets):
#   GEMINI_API_KEY      → tu clave gratuita de Google AI Studio
#   ALLOWED_UID         → el UID de Firebase Auth del único usuario permitido (tú)
#   FIREBASE_PROJECT_ID → el projectId de tu proyecto Firebase
#   ALLOWED_ORIGIN      → https://<tu-usuario>.github.io  (sin barra final)
#
# Opcional (variable normal, no secreta):
#   GEMINI_MODEL        → por defecto "gemini-2.0-flash"; cambia aquí si Google
#                         renombra o retira ese modelo en el futuro
