name = "airfryer-chef-ai-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Secretos (NUNCA van aquí en texto plano — se configuran con `wrangler secret put`
# o en el dashboard de Cloudflare, Settings → Variables and Secrets):
#   GROQ_API_KEY        → tu clave gratuita de console.groq.com
#   FIREBASE_PROJECT_ID → el projectId de tu proyecto Firebase
#   ALLOWED_ORIGIN      → https://<tu-usuario>.github.io  (sin barra final)
#
# Ya NO hace falta ALLOWED_UIDS aquí: el Worker consulta en tiempo real el
# documento config/access de Firestore, así que añadir o quitar personas se
# gestiona desde la propia app (Configuración → Acceso y personas).
#
# Opcional (variable normal, no secreta):
#   GROQ_MODEL          → por defecto "openai/gpt-oss-120b"; cambia aquí si
#                         Groq renombra o retira ese modelo — revisa los
#                         modelos disponibles en console.groq.com/docs/models
